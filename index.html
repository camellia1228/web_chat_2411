<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web chat</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="theme-common.css" />
    <link rel="stylesheet" id="theme-css" href="theme-princess.css" />
    <script>
      try {
        const name = localStorage.getItem('theme');
        if (/^[a-z]+$/.test(name) && name !== 'princess') document.getElementById('theme-css').href = 'theme-' + name + '.css';
      } catch { }
    </script>
  </head>

  <body>
    <details id="theme-picker">
      <summary>🎨 테마: <span id="theme-current"></span></summary>
      <ul id="theme-list"></ul>
    </details>
    <div id="app">
      <header>
        <h1>실시간 웹챗</h1>
      </header>

      <div id="chat-window">
        <ul id="messages"></ul>
      </div>

      <form id="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="메시지를 입력하세요."
          autocomplete="off"
        />
        <button type="submit">보내기</button>
      </form>
    </div>

    <script src="client.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
